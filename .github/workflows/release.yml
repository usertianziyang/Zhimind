# 构建并发布桌面安装包 / Build & publish desktop installers:
#   macOS ARM / Intel (.dmg)
#   Windows x64 NSIS setup + portable zip (绿色版)
#   Linux x64 AppImage / .deb / .rpm (Ubuntu/Debian + Fedora/RHEL family)
# Keep this workflow on the default branch so GitHub can discover it after repository detachment.
# 触发方式 / Triggers:
#   - 推送 v* Tag：正式 Release，并刷新自动更新与官网下载资产。
#   - 手动运行：在 Run workflow 中选择 dev 等分支，发布独立 Prerelease；
#     不刷新正式自动更新、SHA256SUMS 或官网下载别名。
#
# Prerequisites (repo Settings → Actions → General → Workflow permissions):
#   - Read and write permissions (so the job can create/update Releases)
#
# Optional signing secrets (unsigned builds still work; macOS may warn):
#   - Apple (all required together; omit entirely to ship unsigned):
#            APPLE_CERTIFICATE              base64 of Developer ID Application .p12
#            APPLE_CERTIFICATE_PASSWORD     .p12 export password
#            APPLE_SIGNING_IDENTITY         e.g. Developer ID Application: Name (TEAMID)
#            APPLE_TEAM_ID                  10-char Team ID
#            APPLE_API_ISSUER               App Store Connect Issuer ID (UUID)
#            APPLE_API_KEY                  App Store Connect Key ID
#            APPLE_API_KEY_P8               AuthKey_<id>.p8 PEM contents (written to a
#                                           temp path as APPLE_API_KEY_PATH for Tauri)
#     Do NOT create empty APPLE_* secrets. Missing = skip sign/notarize.
#     Prefer App Store Connect API key over APPLE_ID + app-specific password.
#   - Windows Authenticode (optional OV/EV .pfx — removes Unknown publisher when set):
#            WINDOWS_CERTIFICATE            base64-encoded .pfx
#            WINDOWS_CERTIFICATE_PASSWORD   export password for the .pfx
# Auto-update (optional — without these, installers still publish; in-app
# update falls back to the GitHub Releases download path):
#   - GROK_UPDATER_PUBLIC_KEY          minisign public key (embedded in app)
#   - TAURI_SIGNING_PRIVATE_KEY        minisign private key (sign archives)
#   - TAURI_SIGNING_PRIVATE_KEY_PASSWORD  (empty string OK)
# See docs/desktop-auto-update.md and docs/BUILD.md (Windows Authenticode).
name: 桌面端打包与发布 / Release

on:
  push:
    tags:
      - "v*"
  # 手动运行时，直接使用 GitHub 的分支选择器选择 dev；无需额外 ref 输入。
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
            name: macOS-ARM64
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
            name: macOS-x64
          - platform: windows-latest
            args: ""
            name: Windows-x64
          - platform: ubuntu-22.04
            args: ""
            name: Linux-x64

    runs-on: ${{ matrix.platform }}
    name: 构建 / Build ${{ matrix.name }}

    steps:
      - name: 检出源代码 / Checkout
        uses: actions/checkout@v4

      - name: 配置 pnpm / Setup pnpm
        # Do not hardcode version — package.json packageManager (pnpm@9.15.9)
        # is the single source. Dual version input fails with:
        # "Multiple versions of pnpm specified".
        uses: pnpm/action-setup@v4

      - name: 配置 Node.js / Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装 Linux 系统依赖 / Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          # Use Ayatana only — libappindicator3-dev conflicts with libayatana-appindicator3-dev.
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libssl-dev \
            rpm \
            file

      - name: 安装 Rust stable / Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: 缓存 Rust 构建 / Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          shared-key: ${{ matrix.name }}

      - name: 安装前端依赖 / Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: 读取产品名称 / Read Tauri product name
        id: product
        shell: bash
        run: |
          set -euo pipefail
          PRODUCT_NAME="$(python3 -c 'import json; print(json.load(open("src-tauri/tauri.conf.json"))["productName"])')"
          [[ -n "$PRODUCT_NAME" ]]
          echo "name=$PRODUCT_NAME" >> "$GITHUB_OUTPUT"

      # Tag 构建沿用正式版本号；分支构建使用唯一 dev Tag，避免覆盖正式 Release。
      - name: 确定发布类型与目标 Tag / Resolve release target
        id: release
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.ref_type }}" == "tag" && "${{ github.ref_name }}" == v* ]]; then
            [[ "${{ github.ref_name }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-].*)?$ ]]
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "label=v__VERSION__" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            SAFE_REF="$(printf '%s' "${{ github.ref_name }}" | tr -cs 'A-Za-z0-9._-' '-')"
            SHORT_SHA="${GITHUB_SHA:0:7}"
            DEV_TAG="dev-${SAFE_REF}-${GITHUB_RUN_NUMBER}-${SHORT_SHA}"
            [[ "$DEV_TAG" == dev-* ]]
            echo "tag=$DEV_TAG" >> "$GITHUB_OUTPUT"
            echo "label=Dev ${{ github.ref_name }} (${SHORT_SHA})" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi

      # Release description = CHANGELOG.md section for this version (bilingual body).
      # Fails the job if `## [X.Y.Z]` is missing — write changelog before tagging.
      - name: 准备发布说明 / Prepare release notes
        id: changelog
        shell: bash
        env:
          # Windows runners default to cp1252; bilingual CHANGELOG needs UTF-8 stdout.
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"
        run: |
          set -euo pipefail
          if [[ "${{ github.ref_type }}" == "tag" && "${{ github.ref_name }}" == v* ]]; then
            python3 scripts/changelog-for-release.py "${{ github.ref_name }}" | tee release-notes.md
          else
            {
              echo "Development build from \`${{ github.ref_name }}\` at \`${GITHUB_SHA:0:7}\`."
              echo
              echo "开发分支测试包，不进入正式自动更新通道。"
            } | tee release-notes.md
          fi
          # Multiline body for tauri-action `releaseBody` (no releaseBodyFile input).
          {
            echo "RELEASE_BODY<<GROKAPP_EOF"
            cat release-notes.md
            echo "GROKAPP_EOF"
          } >> "$GITHUB_ENV"

      # Detect updater secrets without failing unsigned community builds.
      # Half-config (only one of pubkey/privkey) is a maintainer error — hard-fail
      # so we never ship "looks signed" installers without in-app update enabled.
      - name: 检查自动更新签名 / Detect updater secrets
        id: updater
        if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
        shell: bash
        env:
          GROK_UPDATER_PUBLIC_KEY: ${{ secrets.GROK_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          has_pub=0
          has_priv=0
          [[ -n "${GROK_UPDATER_PUBLIC_KEY:-}" ]] && has_pub=1
          [[ -n "${TAURI_SIGNING_PRIVATE_KEY:-}" ]] && has_priv=1
          if [[ $has_pub -eq 1 && $has_priv -eq 1 ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Updater secrets present — enabling in-app auto-update artifacts"
          elif [[ $has_pub -eq 0 && $has_priv -eq 0 ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Updater secrets missing — building without createUpdaterArtifacts (GitHub manual path)"
          else
            echo "::error::Partial updater secrets: GROK_UPDATER_PUBLIC_KEY=${has_pub} TAURI_SIGNING_PRIVATE_KEY=${has_priv}. Set both or neither."
            exit 1
          fi

      - name: 写入自动更新配置 / Write updater config
        if: steps.updater.outputs.enabled == 'true'
        shell: bash
        env:
          GROK_UPDATER_PUBLIC_KEY: ${{ secrets.GROK_UPDATER_PUBLIC_KEY }}
          GROK_UPDATER_ENDPOINT: https://github.com/${{ github.repository }}/releases/download/grok-desktop-latest/latest.json
        run: node scripts/build-release-config.mjs

      # Windows Authenticode (optional). Without secrets the build stays unsigned
      # (SmartScreen "Unknown publisher" is expected). When present, import the
      # .pfx and write a merge config with certificateThumbprint for tauri-bundler.
      # Do NOT pass empty WINDOWS_* secrets — omit them entirely.
      - name: 导入 Windows 代码签名证书 / Import certificate
        id: win_sign
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrEmpty($env:WINDOWS_CERTIFICATE)) {
            Write-Host "WINDOWS_CERTIFICATE not set — Windows build will be unsigned"
            "enabled=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            return
          }
          if ([string]::IsNullOrEmpty($env:WINDOWS_CERTIFICATE_PASSWORD)) {
            Write-Error "WINDOWS_CERTIFICATE set but WINDOWS_CERTIFICATE_PASSWORD is empty"
            exit 1
          }
          New-Item -ItemType Directory -Force -Path certificate | Out-Null
          $bytes = [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE)
          [IO.File]::WriteAllBytes("$pwd/certificate/certificate.pfx", $bytes)
          $secure = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
          # PFX may include the full chain — pick the leaf with a private key
          # (prefer Code Signing EKU) so thumbprint is a single 40-hex string.
          $imported = @(Import-PfxCertificate -FilePath "$pwd/certificate/certificate.pfx" `
            -CertStoreLocation Cert:\CurrentUser\My -Password $secure)
          $withKey = @($imported | Where-Object { $_.HasPrivateKey })
          $code = @($withKey | Where-Object {
            -not $_.EnhancedKeyUsageList -or
            ($_.EnhancedKeyUsageList | ForEach-Object { $_.FriendlyName }) -contains 'Code Signing'
          }) | Select-Object -First 1
          if (-not $code) { $code = $withKey | Select-Object -First 1 }
          if (-not $code) {
            Write-Error "No certificate with private key found in WINDOWS_CERTIFICATE PFX"
            exit 1
          }
          $thumb = [string]$code.Thumbprint
          if ($thumb -notmatch '^[0-9A-Fa-f]{40}$') {
            Write-Error "Unexpected certificate thumbprint format: $thumb"
            exit 1
          }
          Write-Host "Imported Windows code signing cert thumbprint=$thumb"
          $cfg = @{
            bundle = @{
              windows = @{
                certificateThumbprint = $thumb
                digestAlgorithm = "sha256"
                timestampUrl = "http://timestamp.digicert.com"
              }
            }
          } | ConvertTo-Json -Depth 6
          Set-Content -Path "src-tauri/tauri.windows.sign.conf.json" -Value $cfg -Encoding utf8
          Remove-Item -Recurse -Force certificate -ErrorAction SilentlyContinue
          "enabled=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      # Export Apple env only when APPLE_CERTIFICATE is non-empty.
      # Empty APPLE_CERTIFICATE makes `tauri build` try codesign import and fail with:
      #   "failed to import keychain certificate"
      # TAURI_SIGNING_* are only set when updater is enabled (non-empty).
      # WINDOWS_CERTIFICATE* are only used on windows-latest when present.
      - name: 配置 Apple 签名环境 / Export signing environment
        if: startsWith(matrix.platform, 'macos')
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -euo pipefail
          if [[ -z "${APPLE_CERTIFICATE:-}" ]]; then
            echo "APPLE_CERTIFICATE not set — macOS build will be unsigned"
            exit 0
          fi
          if [[ -z "${APPLE_CERTIFICATE_PASSWORD:-}" || -z "${APPLE_SIGNING_IDENTITY:-}" || -z "${APPLE_TEAM_ID:-}" ]]; then
            echo "::error::APPLE_CERTIFICATE is set but APPLE_CERTIFICATE_PASSWORD / APPLE_SIGNING_IDENTITY / APPLE_TEAM_ID is empty"
            exit 1
          fi
          {
            echo "APPLE_CERTIFICATE<<GROKAPP_EOF"
            printf '%s\n' "$APPLE_CERTIFICATE"
            echo "GROKAPP_EOF"
            echo "APPLE_CERTIFICATE_PASSWORD=$APPLE_CERTIFICATE_PASSWORD"
            echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY"
            echo "APPLE_TEAM_ID=$APPLE_TEAM_ID"
          } >> "$GITHUB_ENV"
          if [[ -n "${APPLE_API_KEY_P8:-}" ]]; then
            if [[ -z "${APPLE_API_ISSUER:-}" || -z "${APPLE_API_KEY:-}" ]]; then
              echo "::error::APPLE_API_KEY_P8 is set but APPLE_API_ISSUER / APPLE_API_KEY is empty"
              exit 1
            fi
            mkdir -p "$RUNNER_TEMP/apple-signing"
            printf '%s\n' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/apple-signing/AuthKey.p8"
            chmod 600 "$RUNNER_TEMP/apple-signing/AuthKey.p8"
            {
              echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/apple-signing/AuthKey.p8"
              echo "APPLE_API_ISSUER=$APPLE_API_ISSUER"
              echo "APPLE_API_KEY=$APPLE_API_KEY"
            } >> "$GITHUB_ENV"
            echo "Apple signing + App Store Connect API key enabled"
          else
            echo "Apple certificate present but no APPLE_API_KEY_P8 — will sign without notarizing"
          fi

      - name: 构建并上传 GitHub Release / Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GROK_UPDATER_PUBLIC_KEY: ${{ github.ref_type == 'tag' && startsWith(github.ref_name, 'v') && secrets.GROK_UPDATER_PUBLIC_KEY || '' }}
          GROK_UPDATER_ENDPOINT: ${{ github.ref_type == 'tag' && startsWith(github.ref_name, 'v') && format('https://github.com/{0}/releases/download/grok-desktop-latest/latest.json', github.repository) || '' }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ github.ref_type == 'tag' && startsWith(github.ref_name, 'v') && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ github.ref_type == 'tag' && startsWith(github.ref_name, 'v') && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        with:
          # Root package.json + src-tauri/ layout (create-tauri-app style)
          projectPath: .
          tagName: ${{ steps.release.outputs.tag }}
          releaseName: "${{ steps.product.outputs.name }} ${{ steps.release.outputs.label }}"
          releaseBody: ${{ env.RELEASE_BODY }}
          releaseDraft: false
          prerelease: ${{ steps.release.outputs.prerelease }}
          # --config injects pubkey/endpoint + createUpdaterArtifacts and/or Windows thumbprint.
          # GROK_UPDATER_* env (above) enables build.rs registration cfg.
          args: >-
            ${{ matrix.args }}
            ${{ steps.updater.outputs.enabled == 'true' && ' --config src-tauri/tauri.release.conf.json' || '' }}
            ${{ matrix.platform == 'windows-latest' && steps.win_sign.outputs.enabled == 'true' && ' --config src-tauri/tauri.windows.sign.conf.json' || '' }}
          # We assemble a multi-platform latest.json in assemble-updater-manifest.
          includeUpdaterJson: false

      # macOS: tauri-action often uploads only the .dmg. Silent update needs the
      # signed .app.tar.gz (+ .sig) with arch in the filename for assemble-updater.
      - name: 上传 macOS 自动更新归档 / Upload updater archives
        if: startsWith(matrix.platform, 'macos') && steps.updater.outputs.enabled == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.release.outputs.tag }}"
          VER="${TAG#v}"
          if [[ "${{ matrix.args }}" == *aarch64* ]]; then
            ARCH=aarch64
            TRIPLE=aarch64-apple-darwin
          else
            ARCH=x64
            TRIPLE=x86_64-apple-darwin
          fi
          BUNDLE="src-tauri/target/${TRIPLE}/release/bundle/macos"
          # Fallback if no --target dir (host arch build).
          if [[ ! -d "$BUNDLE" ]]; then
            BUNDLE="src-tauri/target/release/bundle/macos"
          fi
          SRC_TAR="$(find "$BUNDLE" -maxdepth 1 -name '*.app.tar.gz' ! -name '*.sig' | head -1 || true)"
          if [[ -z "$SRC_TAR" || ! -f "$SRC_TAR" ]]; then
            echo "::error::macOS updater archive missing under $BUNDLE (need bundle target 'app')"
            ls -la "$BUNDLE" 2>/dev/null || true
            exit 1
          fi
          SRC_SIG="${SRC_TAR}.sig"
          if [[ ! -f "$SRC_SIG" ]]; then
            echo "::error::missing signature for $SRC_TAR"
            exit 1
          fi
          # Keep the historical Grok name for the rolling updater URL.
          OUT_TAR="Grok_${VER}_${ARCH}.app.tar.gz"
          OUT_SIG="${OUT_TAR}.sig"
          cp "$SRC_TAR" "$OUT_TAR"
          cp "$SRC_SIG" "$OUT_SIG"
          echo "Uploading $OUT_TAR (+ .sig) to $TAG"
          gh release upload "$TAG" "$OUT_TAR" "$OUT_SIG" --clobber

      # 绿色版：免安装 zip（单文件 exe + 说明）。WebView2 仍由系统提供。
      - name: 打包 Windows 绿色版 / Package portable zip
        if: matrix.platform == 'windows-latest'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          bash scripts/package-windows-portable.sh "${{ steps.release.outputs.tag }}"

  # After all platform builds: merge .sig + archives into rolling latest.json.
  # Skips cleanly when updater secrets were never used (no .sig on the release).
  assemble-updater:
    needs: publish
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: ubuntu-22.04
    name: 生成自动更新清单 / Assemble updater
    steps:
      - name: 检出源代码 / Checkout
        uses: actions/checkout@v4

      - name: 生成滚动更新 Release / Assemble rolling release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GROK_UPDATER_PUBLIC_KEY: ${{ secrets.GROK_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${GROK_UPDATER_PUBLIC_KEY:-}" || -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]]; then
            echo "Updater secrets not configured — skip assemble-updater-manifest"
            exit 0
          fi
          TAG="${{ github.ref_name }}"
          # Hard-fail when secrets are present but rolling manifest cannot be built —
          # otherwise clients stay stuck on the GitHub manual-download path.
          TAG="$TAG" REPO="$GITHUB_REPOSITORY" bash scripts/assemble-updater-manifest.sh

  # Supply-chain floor (NEW-06): one SHA256SUMS over every published asset so
  # users can verify downloads. Runs after all platform builds have uploaded.
  checksums:
    needs: [publish, assemble-updater]
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: ubuntu-22.04
    name: 发布校验和与官网下载资产 / Checksums
    steps:
      - name: 检出源代码 / Checkout
        uses: actions/checkout@v4

      - name: 生成并上传校验和与稳定别名 / Publish checksums
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          mkdir -p /tmp/release-assets
          cd /tmp/release-assets
          # Download everything except a stale checksum file from a rebuild.
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*' || true
          rm -f SHA256SUMS
          # Stable aliases keep the historical Grok_* download URLs.
          # + downloads.json for grok-app.com. Files stay on GitHub Releases.
          python3 "${GITHUB_WORKSPACE}/scripts/publish-website-downloads.py" \
            --dir /tmp/release-assets \
            --tag "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --write-aliases
          shopt -s nullglob
          files=(*)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "error: no release assets found for $TAG" >&2
            exit 1
          fi
          sha256sum "${files[@]}" > SHA256SUMS
          cat SHA256SUMS
          extra=()
          if [[ -f .website-upload.txt ]]; then
            while IFS= read -r line || [[ -n "$line" ]]; do
              [[ -z "${line:-}" ]] && continue
              extra+=("$line")
            done < .website-upload.txt
          fi
          gh release upload "$TAG" SHA256SUMS "${extra[@]}" --repo "$GITHUB_REPOSITORY" --clobber
